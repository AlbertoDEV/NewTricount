<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{header :: header}">
    <title th:text="#{creategroup.title}">Create Group</title>
</head>
<body>
    <div th:replace="~{navbar :: navbar}"></div>
    <div class="container mt-4">
        <h1 class="mb-4" th:text="#{creategroup.title}">Create a New Group</h1>
        <form th:action="@{/groups/new}" method="post">
            <div class="form-group mb-3">
                <label for="name" th:text="#{creategroup.name}">Group Name:</label>
                <input type="text" id="name" name="name" class="form-control" required>
            </div>
            <div class="form-group mb-3">
                <label for="description" th:text="#{creategroup.description}">Description:</label>
                <textarea id="description" name="description" class="form-control"></textarea>
            </div>
            <div>
                <button type="submit" class="btn btn-primary" th:text="#{creategroup.button}">Create Group</button>
            </div>
        </form>
        <a th:href="@{/dashboard}" class="btn btn-secondary mt-3" th:text="#{dashboard.back}">Back to Dashboard</a>
    </div>
</body>
</html>
