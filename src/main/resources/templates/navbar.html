<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
    <nav class="navbar" th:fragment="navbar">
        <div class="navbar-container">
            <a th:href="@{/dashboard}" class="navbar-brand" th:text="#{app.title}">Gastos</a>
            <div class="navbar-menu-container">
                <div sec:authorize="isFullyAuthenticated()">
                    <form th:action="@{/logout}" method="post" style="display: inline;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="logout-link" th:text="#{dashboard.logout}" style="background: none; border: none; padding: 0; cursor: pointer; color: white; text-decoration: none;"></button>
                    </form>
                </div>
                <button id="menu-toggle" class="menu-toggle">
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                </button>
                <div id="language-menu" class="language-menu">
                    <a th:href="@{''(lang=en)}" th:text="#{lang.en}"></a>
                    <a th:href="@{''(lang=es)}" th:text="#{lang.es}"></a>
                </div>
            </div>
        </div>
    </nav>
</body>
</html>
