<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{header :: header}">
    <title th:text="#{register.title}">Register</title>
</head>
<body>
    <div th:replace="~{navbar :: navbar}"></div>
    <div class="container mt-4">
        <h1 class="mb-4" th:text="#{register.title}">Register</h1>
        <form th:action="@{/register}" method="post">
            <div class="form-group mb-3">
                <label for="username" th:text="#{register.username}">Username:</label>
                <input type="text" id="username" name="username" class="form-control" required>
            </div>
            <div class="form-group mb-3">
                <label for="email" th:text="#{register.email}">Email:</label>
                <input type="email" id="email" name="email" class="form-control" required>
            </div>
            <div class="form-group mb-3">
                <label for="password" th:text="#{register.password}">Password:</label>
                <input type="password" id="password" name="password" class="form-control" required>
            </div>
            <div>
                <button type="submit" class="btn btn-primary" th:text="#{register.button}">Register</button>
            </div>
        </form>
        <p th:if="${error}" th:text="${error}" class="text-danger mt-3"></p>
        <p class="mt-3">
            <span th:text="#{register.login.prompt}">Already have an account?</span>
            <a th:href="@{/login}" class="link-secondary" th:text="#{register.login.action}">Login here</a>
        </p>
    </div>
</body>
</html>
